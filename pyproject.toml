# Tool configuration only (no [project] table: the pipeline is run as a module,
# not installed as a package). Dependencies live in requirements-dev.txt.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# fixtures/ holds standalone repos with their own test files; never collect them
norecursedirs = ["fixtures"]
markers = [
    "docker: test requires a running Docker daemon",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/fixtures/mini_pkg", "tests/fixtures/mini_pkg_notests", "target-repo-scan"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
